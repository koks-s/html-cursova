<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Сторінку не знайдено | BUKO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--bg); }
    .error-page__content { padding: 2rem; }
    .error-page__num { font-family: var(--font-display); font-size: clamp(8rem, 20vw, 16rem); font-weight: 300; color: var(--accent); line-height: 1; letter-spacing: -0.04em; }
    .error-page__title { font-family: var(--font-display); font-size: 2rem; font-weight: 400; margin-bottom: 1rem; }
    .error-page__text { color: var(--text-muted); margin-bottom: 2.5rem; max-width: 400px; margin-left: auto; margin-right: auto; }
    .header { position: fixed; }
  </style>
</head>
<body>
  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="logo">BUKO</a>
      <nav class="nav" id="menuList">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Головна</a></li>
          <li><a href="products.html" class="nav__link">Каталог</a></li>
          <li><a href="about.html" class="nav__link">Про нас</a></li>
          <li><a href="contacts.html" class="nav__link">Контакти</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <button class="burger" id="burgerIcons"><span id="iconBars"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span><span id="iconXmark" class="hide"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></button>
      </div>
    </div>
  </header>

  <main class="error-page">
    <div class="error-page__content">
      <div class="error-page__num">404</div>
      <h1 class="error-page__title">Сторінку не знайдено</h1>
      <p class="error-page__text">Схоже, цей стілець кудись пішов. Поверніться на головну і знайдіть щось чудове.</p>
      <a href="index.html" class="btn btn--primary">На головну</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
